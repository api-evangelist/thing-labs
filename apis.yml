name: Thing Labs
description: >-
  Thing Labs was an early consumer social-software startup founded in 2008 by
  Jason Shellen (previously a product lead on Blogger and a co-creator of Google
  Reader at Google). The company built browser-based social tools including
  Plinky (daily writing prompts), Brizzly and the Brizzly Guide (a web-based
  Twitter/social client), and Let's Be Trends. Backed by SoftTech VC (now Uncork
  Capital) alongside angel investors, Thing Labs was acquired by AOL in September
  2010, after which Shellen became VP of Product for AOL's AIM & Messaging group.
  Thing Labs no longer exists as an independent entity and publishes no public
  developer portal, documentation, OpenAPI/AsyncAPI, or machine-readable API
  surface; this profile is retained as a portfolio-lead record for the API
  Evangelist network.
